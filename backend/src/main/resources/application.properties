# ==========================================
# Fee Payment Management Platform
# Application Configuration
# ==========================================

spring.application.name=fee-payment-management

# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# DataSource Configuration (PostgreSQL 17)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/fee_payment_db
spring.datasource.username=postgres
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Logging
# ==========================================
logging.level.root=INFO
logging.level.com.feepayment=DEBUG
