<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student — Fee Payment Management | MMCOE</title>

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Dashboard CSS -->
    <link href="../assets/css/dashboard.css" rel="stylesheet">
</head>
<body data-page="admin-add-student">

<div class="dashboard-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-mortarboard-fill"></i>
            <div>
                <div class="sidebar-brand-title">MMCOE Admin</div>
                <div class="sidebar-brand-sub">Fee Management System</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="sidebar-nav-header">Main Menu</div>
            <a href="dashboard.html" class="nav-link-custom">
                <i class="bi bi-speedometer2"></i> Dashboard Overview
            </a>
            <a href="students.html" class="nav-link-custom">
                <i class="bi bi-people"></i> Manage Students
            </a>
            <a href="dashboard.html#fee-structure" class="nav-link-custom">
                <i class="bi bi-cash-stack"></i> Manage Fee Structure
            </a>
            <a href="add-student.html" class="nav-link-custom active">
                <i class="bi bi-person-plus"></i> Add Student
            </a>
            <a href="../reports/reports.html" class="nav-link-custom">
                <i class="bi bi-file-earmark-bar-graph"></i> Reports &amp; Analysis
            </a>

            <div class="sidebar-nav-header">Account</div>
            <a href="profile.html" class="nav-link-custom">
                <i class="bi bi-person-circle"></i> My Profile
            </a>
            <a href="#" class="nav-link-custom text-danger" onclick="logout()">
                <i class="bi bi-box-arrow-right"></i> Sign Out
            </a>
        </nav>

        <div class="sidebar-footer">
            <span>AY 2025-26 &bull; Pune University</span>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="btn btn-outline-secondary btn-sm d-lg-none" type="button" onclick="document.getElementById('sidebar').classList.toggle('show')">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="topbar-title">Add New Student</h1>
            </div>
            <div class="topbar-right">
                <a href="students.html" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back to Directory
                </a>
                <div class="user-badge">
                    <div class="user-avatar">A</div>
                    <div>
                        <div class="user-name">Administrator</div>
                        <div class="user-role">System Admin</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Page Body -->
        <main class="page-body">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="content-card">
                        <div class="content-card-header">
                            <h3><i class="bi bi-person-plus text-primary"></i> Student Registration Form</h3>
                        </div>
                        <div class="content-card-body">
                            <div id="addStudentAlert" class="alert d-none py-2 px-3 mb-3"></div>

                            <form id="addStudentForm" onsubmit="handleRegisterStudent(event)">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="studentName" class="form-label">Full Name <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="studentName" placeholder="e.g. Ramesh Kumar Sharma" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="studentPrn" class="form-label">PRN Number <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control text-uppercase" id="studentPrn" placeholder="e.g. B25IT2011" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="studentEmail" class="form-label">Email Address <span class="text-danger">*</span></label>
                                        <input type="email" class="form-control" id="studentEmail" placeholder="e.g. ramesh@mmcoe.com" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="studentMobile" class="form-label">Mobile Number <span class="text-danger">*</span></label>
                                        <input type="tel" class="form-control" id="studentMobile" placeholder="e.g. 9876543210" pattern="[0-9]{10}" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="studentDept" class="form-label">Department <span class="text-danger">*</span></label>
                                        <select class="form-select" id="studentDept" required>
                                            <option value="">Select Department</option>
                                            <option value="Information Technology">Information Technology</option>
                                            <option value="Computer Science">Computer Science</option>
                                            <option value="Mechanical">Mechanical</option>
                                            <option value="Civil">Civil</option>
                                            <option value="Electronics">Electronics</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="studentCourse" class="form-label">Course</label>
                                        <select class="form-select" id="studentCourse">
                                            <option value="B.Tech" selected>B.Tech</option>
                                            <option value="M.Tech">M.Tech</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="studentYear" class="form-label">Academic Year</label>
                                        <select class="form-select" id="studentYear">
                                            <option value="2025-26" selected>2025-26</option>
                                            <option value="2024-25">2024-25</option>
                                        </select>
                                    </div>
                                </div>

                                <hr class="my-4 text-muted">

                                <div class="d-flex justify-content-end gap-2">
                                    <a href="students.html" class="btn btn-secondary">Cancel</a>
                                    <button type="submit" class="btn btn-primary" id="saveStudentBtn">
                                        <i class="bi bi-check2-circle me-1"></i> Register Student
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/auth.js"></script>

<script>
async function handleRegisterStudent(e) {
    e.preventDefault();

    const name = document.getElementById('studentName').value.trim();
    const prn = document.getElementById('studentPrn').value.trim().toUpperCase();
    const email = document.getElementById('studentEmail').value.trim();
    const mobile = document.getElementById('studentMobile').value.trim();
    const department = document.getElementById('studentDept').value;
    const course = document.getElementById('studentCourse').value;
    const academicYear = document.getElementById('studentYear').value;

    const alertEl = document.getElementById('addStudentAlert');
    const submitBtn = document.getElementById('saveStudentBtn');

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';

    const payload = {
        name,
        prn,
        email,
        mobile,
        department,
        course,
        academicYear,
        status: 'ACTIVE'
    };

    try {
        const result = await apiFetch('/admin/students', {
            method: 'POST',
            body: JSON.stringify(payload)
        });

        if (result && result.ok) {
            alertEl.className = 'alert alert-success py-2 px-3 mb-3';
            alertEl.textContent = 'Student registered successfully! Redirecting...';
            alertEl.classList.remove('d-none');
            setTimeout(() => {
                window.location.href = 'students.html';
            }, 1200);
            return;
        } else {
            const msg = result && result.data && result.data.message ? result.data.message : 'Failed to register student.';
            alertEl.className = 'alert alert-danger py-2 px-3 mb-3';
            alertEl.textContent = msg;
            alertEl.classList.remove('d-none');
        }
    } catch (err) {
        alertEl.className = 'alert alert-danger py-2 px-3 mb-3';
        alertEl.textContent = 'Error connecting to server. Please try again.';
        alertEl.classList.remove('d-none');
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Register Student';
    }
}
</script>

</body>
</html>
