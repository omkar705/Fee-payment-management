<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Payment Management System | MMCOE</title>

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Login CSS -->
    <link href="assets/css/login.css" rel="stylesheet">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <!-- College Header -->
        <div class="login-header">
            <div class="college-logo">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h2>MMCOE Fee Portal</h2>
            <p>Fee Payment Management System</p>
        </div>

        <!-- Card Body -->
        <div class="login-body">

            <!-- Alerts -->
            <div id="loginError" class="alert alert-danger d-none py-2 px-3 mb-3" style="font-size: 0.88rem;" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="loginErrorText">Invalid credentials.</span>
            </div>
            <div id="loginSuccess" class="alert alert-success d-none py-2 px-3 mb-3" style="font-size: 0.88rem;" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span id="loginSuccessText">Login successful! Redirecting...</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>

                <!-- Role Selection -->
                <div class="mb-3">
                    <label for="role" class="form-label">Select Role</label>
                    <select id="role" class="form-select" required>
                        <option value="STUDENT" selected>Student</option>
                        <option value="ACCOUNTS">Accounts Officer</option>
                        <option value="ADMIN">Administrator</option>
                    </select>
                </div>

                <!-- Username / Email / PRN -->
                <div class="mb-3">
                    <label for="username" class="form-label">Username / PRN / Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person text-secondary"></i></span>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            placeholder="e.g. b25it2010@mmcoe.com or B25IT2010"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock text-secondary"></i></span>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember / Forgot Link -->
                <div class="d-flex justify-content-between align-items-center mb-3" style="font-size: 0.85rem;">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                        <label class="form-check-label text-secondary" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="text-decoration-none text-primary" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">
                        Forgot password?
                    </a>
                </div>

                <!-- Submit Button -->
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary" id="loginSubmitBtn">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </div>
            </form>

            <!-- Quick Demo Credentials for Viva Demonstration -->
            <div class="demo-box">
                <div class="demo-box-title">
                    <span><i class="bi bi-key-fill text-warning me-1"></i> Demo Accounts</span>
                    <span class="badge bg-secondary-subtle text-secondary" style="font-size: 0.7rem;">Click to fill</span>
                </div>
                <div class="demo-btn-group">
                    <button type="button" class="demo-btn" onclick="fillCredentials('b25it2010@mmcoe.com', 'Student@123', 'STUDENT')">
                        <strong>Student</strong>
                        <span>Manan (B25IT2010)</span>
                    </button>
                    <button type="button" class="demo-btn" onclick="fillCredentials('accounts@mmcoe.com', 'Accounts@123', 'ACCOUNTS')">
                        <strong>Accounts</strong>
                        <span>Accounts Officer</span>
                    </button>
                    <button type="button" class="demo-btn" onclick="fillCredentials('admin@mmcoe.com', 'Admin@123', 'ADMIN')">
                        <strong>Admin</strong>
                        <span>Administrator</span>
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Forgot Password Modal -->
<div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fs-6 fw-bold" id="forgotModalLabel">
                    <i class="bi bi-shield-lock me-1 text-primary"></i> Reset Password
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="forgotPasswordForm">
                <div class="modal-body">
                    <p class="text-secondary small mb-3">
                        Enter your registered email address to receive password reset instructions.
                    </p>
                    <div id="forgotAlert" class="alert d-none py-2 px-3 mb-3 small"></div>
                    <div class="mb-3">
                        <label for="forgotEmail" class="form-label">Registered Email</label>
                        <input type="email" class="form-control" id="forgotEmail" placeholder="e.g. b25it2010@mmcoe.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="forgotRole" class="form-label">Account Role</label>
                        <select id="forgotRole" class="form-select" required>
                            <option value="STUDENT">Student</option>
                            <option value="ACCOUNTS">Accounts Officer</option>
                            <option value="ADMIN">Administrator</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm" id="forgotSubmitBtn">Send Instructions</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Auth & Login Scripts -->
<script src="assets/js/auth.js"></script>
<script src="assets/js/login.js"></script>

<script>
function fillCredentials(user, pass, role) {
    document.getElementById('username').value = user;
    document.getElementById('password').value = pass;
    document.getElementById('role').value = role;
}
</script>

</body>
</html>
