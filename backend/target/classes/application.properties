# ============================================================
# Fee Payment Management — Application Configuration
# Milestone 1 — JDBC (JdbcTemplate) mode
# ============================================================

# Server
server.port=8080
server.servlet.context-path=/

# ============================================================
# Database Configuration (H2 In-Memory - PostgreSQL Compatibility Mode)
# ============================================================
spring.datasource.url=jdbc:h2:mem:fee_payment_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ============================================================
# JWT Configuration
# ============================================================
# Replace this secret with a strong 256-bit secret in production
app.jwt.secret=fee-payment-mmcoe-super-secret-key-2025-change-in-production
app.jwt.expiration-ms=86400000

# ============================================================
# Application Configuration
# ============================================================
app.name=Fee Payment Management Platform
app.college=MMCOE

# ============================================================
# CORS Configuration
# ============================================================
app.cors.allowed-origins=*

# ============================================================
# Logging
# ============================================================
logging.level.com.feepayment=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.jdbc.core=DEBUG
